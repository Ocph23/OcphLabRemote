image: debian:latest

stages:
  - build
  - publish

build_deb:
  stage: build
  script:
    # 1. Perbaiki permission file dan folder secara otomatis di pipeline
    - chmod 755 ocphlabremote_1.0_amd64
    - chmod 755 ocphlabremote_1.0_amd64/DEBIAN
    - chmod 644 ocphlabremote_1.0_amd64/DEBIAN/control
    - chmod +x ocphlabremote_1.0_amd64/usr/bin/ocphlabremote
    
    # 2. Build file .deb
    - dpkg-deb --build ocphlabremote_1.0_amd64
  
  artifacts:
    paths:
      - ocphlabremote_1.0_amd64.deb
    expire_in: 1 week

publish_deb:
  stage: publish
  dependencies:
    - build_deb
  script:
    - apt-get update && apt-get install -y curl
    
    # 3. Upload ke GitLab Debian Package Registry
    # Variabel CI_JOB_TOKEN, CI_API_V4_URL, dan CI_PROJECT_ID otomatis diisi oleh GitLab
    - 'curl --request PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ocphlabremote_1.0_amd64.deb "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/debian/ocphlabremote_1.0_amd64.deb"'
  
  # Hanya jalankan publish saat ada commit ke branch main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"