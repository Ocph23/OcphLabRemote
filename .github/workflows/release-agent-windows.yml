name: Release Windows Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.1.8
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows agent
        run: |
          dotnet publish LabRemote.Agent/LabRemote.Agent.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true --output artifacts/agent-win-x64
          cd artifacts/agent-win-x64
          zip -r ../ocphlabremote-agent-win-x64.zip .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "OCPH LabRemote $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/ocphlabremote-agent-win-x64.zip --clobber
